<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Soft Shadows -->
    <filter id="groundShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22" />
      <feOffset dx="0" dy="36" result="offsetblur" />
      <feFlood flood-color="#001810" flood-opacity="0.28" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients for 3D Building Walls -->
    <linearGradient id="wallFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#F4F8F6" />
      <stop offset="100%" stop-color="#E2EBE6" />
    </linearGradient>

    <linearGradient id="wallSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D2DFD8" />
      <stop offset="100%" stop-color="#BACCC3" />
    </linearGradient>

    <linearGradient id="roofTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="50%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <linearGradient id="roofTrim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>

    <!-- Awning Stripes -->
    <linearGradient id="awningRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="60%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#C62828" />
    </linearGradient>

    <linearGradient id="awningWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="awningSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B71C1C" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>

    <!-- Glass Windows with Warm Interior Glow -->
    <linearGradient id="glassGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#FED7AA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="windowFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="doorWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <linearGradient id="doorGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>

    <linearGradient id="signboardBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <linearGradient id="pavementBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="crateWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <g filter="url(#groundShadow)">
    <!-- Base / Pavement Platform (Isometric 3D Foundation) -->
    <path d="M 512 850 L 890 660 L 512 470 L 134 660 Z" fill="url(#pavementBase)" />
    <!-- Pavement Front Edge Depth -->
    <path d="M 134 660 L 512 850 L 512 885 L 134 695 Z" fill="#64748B" />
    <path d="M 512 850 L 890 660 L 890 695 L 512 885 Z" fill="#475569" />

    <!-- Isometric Main Building Walls -->
    <!-- Front Facade (Left facing in isometric) -->
    <path d="M 230 600 L 512 740 L 512 360 L 230 220 Z" fill="url(#wallFront)" />
    <!-- Side Facade (Right facing in isometric) -->
    <path d="M 512 740 L 794 600 L 794 220 L 512 360 Z" fill="url(#wallSide)" />

    <!-- Wall Accent Molding / Foundation Strip -->
    <path d="M 230 600 L 512 740 L 512 710 L 230 570 Z" fill="#059669" />
    <path d="M 512 740 L 794 600 L 794 570 L 512 710 Z" fill="#047857" />

    <!-- Shop Top Roof Cornice Structure -->
    <path d="M 200 220 L 512 375 L 824 220 L 512 65 Z" fill="url(#roofTop)" />
    <!-- Roof Trim Left -->
    <path d="M 200 220 L 512 375 L 512 400 L 200 245 Z" fill="url(#roofTrim)" />
    <!-- Roof Trim Right -->
    <path d="M 512 375 L 824 220 L 824 245 L 512 400 Z" fill="#0F3922" />

    <!-- Rooftop Decorative Parapet / Store Header Billboard -->
    <g transform="translate(0, -10)">
      <path d="M 330 185 L 694 185 L 694 105 L 330 105 Z" fill="url(#signboardBg)" rx="12" />
      <path d="M 335 110 L 689 110 L 689 180 L 335 180 Z" fill="none" stroke="#F59E0B" stroke-width="3" rx="8" />
      <!-- Store Signboard Text -->
      <text x="512" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="url(#goldText)" text-anchor="middle" letter-spacing="4">GENERAL STORE</text>
      <text x="512" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="3">★ OPEN 24/7 ★</text>
    </g>

    <!-- Big Front Showroom Window with Products & Shelves (Left Facade) -->
    <!-- Window Frame -->
    <path d="M 260 550 L 400 620 L 400 400 L 260 330 Z" fill="url(#windowFrame)" />
    <!-- Window Glass -->
    <path d="M 268 540 L 392 602 L 392 412 L 268 350 Z" fill="url(#glassGlow)" />

    <!-- Interior Shelves visible through glass -->
    <!-- Shelf 1 (Bottom) -->
    <path d="M 275 520 L 385 575 L 385 565 L 275 510 Z" fill="#78350F" />
    <!-- Product items on bottom shelf (Cans / Jars) -->
    <rect x="282" y="490" width="14" height="20" fill="#EF4444" rx="3" transform="skewY(26)" />
    <rect x="302" y="480" width="14" height="20" fill="#10B981" rx="3" transform="skewY(26)" />
    <rect x="322" y="470" width="14" height="20" fill="#F59E0B" rx="3" transform="skewY(26)" />
    <rect x="342" y="460" width="14" height="20" fill="#3B82F6" rx="3" transform="skewY(26)" />

    <!-- Shelf 2 (Top) -->
    <path d="M 275 450 L 385 505 L 385 495 L 275 440 Z" fill="#78350F" />
    <!-- Product boxes on top shelf -->
    <rect x="285" y="415" width="22" height="24" fill="#EC4899" rx="3" transform="skewY(26)" />
    <rect x="315" y="400" width="20" height="24" fill="#8B5CF6" rx="3" transform="skewY(26)" />
    <rect x="345" y="385" width="24" height="24" fill="#F97316" rx="3" transform="skewY(26)" />

    <!-- Window Glass Glare Diagonal Reflection -->
    <path d="M 285 365 L 380 470 L 350 495 L 270 395 Z" fill="#FFFFFF" fill-opacity="0.3" />
    <path d="M 330 365 L 390 415 L 380 435 L 315 385 Z" fill="#FFFFFF" fill-opacity="0.25" />

    <!-- Store Main Entrance Doorway (Left Facade Right Side) -->
    <!-- Door Frame Outer -->
    <path d="M 420 685 L 498 724 L 498 480 L 420 441 Z" fill="#0F172A" />
    <!-- Door Leaf -->
    <path d="M 426 676 L 492 709 L 492 490 L 426 457 Z" fill="url(#doorWood)" />
    <!-- Door Glass Insert -->
    <path d="M 434 620 L 484 645 L 484 510 L 434 485 Z" fill="url(#doorGlass)" />
    <!-- Door Handle (Metallic Gold) -->
    <ellipse cx="440" cy="590" rx="3" ry="8" fill="#FDE047" stroke="#CA8A04" stroke-width="1.5" />
    <!-- Welcome Mat in front of door -->
    <path d="M 410 710 L 470 740 L 440 755 L 380 725 Z" fill="#DC2626" rx="3" />
    <text x="425" y="735" font-family="sans-serif" font-size="9" font-weight="900" fill="#FEF08A" transform="rotate(27, 425, 735)" text-anchor="middle">WELCOME</text>

    <!-- Side Window & Secondary Features (Right Facade) -->
    <!-- Side Display Window Frame -->
    <path d="M 540 705 L 720 615 L 720 425 L 540 515 Z" fill="url(#windowFrame)" />
    <!-- Side Display Window Glass -->
    <path d="M 548 693 L 712 611 L 712 437 L 548 519 Z" fill="url(#glassGlow)" />
    <!-- Side Window Shelves & Bottles -->
    <path d="M 555 645 L 705 570 L 705 560 L 555 635 Z" fill="#78350F" />
    <rect x="570" y="580" width="16" height="28" fill="#10B981" rx="4" transform="skewY(-26)" />
    <rect x="600" y="595" width="16" height="28" fill="#F59E0B" rx="4" transform="skewY(-26)" />
    <rect x="630" y="610" width="16" height="28" fill="#EF4444" rx="4" transform="skewY(-26)" />
    <rect x="660" y="625" width="16" height="28" fill="#6366F1" rx="4" transform="skewY(-26)" />

    <!-- Side Window Glass Glare -->
    <path d="M 560 535 L 680 525 L 650 565 L 545 575 Z" fill="#FFFFFF" fill-opacity="0.3" />

    <!-- Side Wall Air Conditioner Unit & Vent -->
    <g transform="translate(735, 360)">
      <path d="M 0 40 L 45 18 L 45 -15 L 0 7 Z" fill="#E2E8F0" />
      <path d="M 0 40 L -20 30 L -20 -3 L 0 7 Z" fill="#CBD5E1" />
      <path d="M 0 7 L -20 -3 L 25 -25 L 45 -15 Z" fill="#F8FAFC" />
      <!-- Fan Vent lines -->
      <line x1="10" y1="28" x2="35" y2="15" stroke="#64748B" stroke-width="2" />
      <line x1="10" y1="34" x2="35" y2="21" stroke="#64748B" stroke-width="2" />
    </g>

    <!-- Spectacular 3D Canopy Awning extending forward -->
    <!-- Awning Top Surface Stripes (Front Awning) -->
    <!-- Stripe 1 Red -->
    <path d="M 215 390 L 260 412 L 230 480 L 185 458 Z" fill="url(#awningRed)" />
    <!-- Stripe 2 White -->
    <path d="M 260 412 L 305 434 L 275 502 L 230 480 Z" fill="url(#awningWhite)" />
    <!-- Stripe 3 Red -->
    <path d="M 305 434 L 350 456 L 320 524 L 275 502 Z" fill="url(#awningRed)" />
    <!-- Stripe 4 White -->
    <path d="M 350 456 L 395 478 L 365 546 L 320 524 Z" fill="url(#awningWhite)" />
    <!-- Stripe 5 Red -->
    <path d="M 395 478 L 440 500 L 410 568 L 365 546 Z" fill="url(#awningRed)" />
    <!-- Stripe 6 White -->
    <path d="M 440 500 L 485 522 L 455 590 L 410 568 Z" fill="url(#awningWhite)" />
    <!-- Stripe 7 Red (Corner) -->
    <path d="M 485 522 L 530 544 L 500 612 L 455 590 Z" fill="url(#awningRed)" />

    <!-- Awning Scalloped Front Valance Drops -->
    <path d="M 185 458 Q 207 482 230 480 Q 252 504 275 502 Q 297 526 320 524 Q 342 548 365 546 Q 387 570 410 568 Q 432 592 455 590 Q 477 614 500 612 L 500 622 Q 477 624 455 600 Q 432 602 410 578 Q 387 580 365 556 Q 342 558 320 534 Q 297 536 275 512 Q 252 514 230 490 Q 207 492 185 468 Z" fill="#991B1B" />

    <!-- Right Side Awning Face -->
    <!-- Stripe 1 Side Red -->
    <path d="M 530 544 L 575 522 L 545 454 L 500 612 Z" fill="url(#awningSide)" />
    <path d="M 575 522 L 620 500 L 590 432 L 545 454 Z" fill="#E2E8F0" />
    <path d="M 620 500 L 665 478 L 635 410 L 590 432 Z" fill="url(#awningSide)" />
    <path d="M 665 478 L 710 456 L 680 388 L 635 410 Z" fill="#E2E8F0" />
    <path d="M 710 456 L 755 434 L 725 366 L 680 388 Z" fill="url(#awningSide)" />

    <!-- Outdoor Display Props: Fresh Fruit Wooden Crates & Shopping Basket -->
    <!-- Crate 1 (Apples / Tomatoes) -->
    <g transform="translate(195, 620)">
      <!-- Crate Isometric box -->
      <path d="M 20 40 L 70 65 L 110 45 L 60 20 Z" fill="url(#crateWood)" />
      <path d="M 20 40 L 70 65 L 70 95 L 20 70 Z" fill="#92400E" />
      <path d="M 70 65 L 110 45 L 110 75 L 70 95 Z" fill="#78350F" />
      <!-- Red Apples in Crate -->
      <circle cx="50" cy="38" r="9" fill="#EF4444" />
      <circle cx="65" cy="45" r="9" fill="#DC2626" />
      <circle cx="80" cy="38" r="9" fill="#EF4444" />
      <circle cx="45" cy="48" r="8" fill="#B91C1C" />
      <circle cx="60" cy="55" r="8" fill="#EF4444" />
      <circle cx="75" cy="48" r="8" fill="#DC2626" />
      <circle cx="90" cy="42" r="8" fill="#EF4444" />
    </g>

    <!-- Crate 2 (Oranges / Citrus) -->
    <g transform="translate(265, 655)">
      <!-- Crate Isometric box -->
      <path d="M 20 40 L 70 65 L 110 45 L 60 20 Z" fill="url(#crateWood)" />
      <path d="M 20 40 L 70 65 L 70 95 L 20 70 Z" fill="#92400E" />
      <path d="M 70 65 L 110 45 L 110 75 L 70 95 Z" fill="#78350F" />
      <!-- Fresh Oranges in Crate -->
      <circle cx="50" cy="38" r="9" fill="#F97316" />
      <circle cx="65" cy="45" r="9" fill="#EA580C" />
      <circle cx="80" cy="38" r="9" fill="#F97316" />
      <circle cx="45" cy="48" r="8" fill="#C2410C" />
      <circle cx="60" cy="55" r="8" fill="#FB923C" />
      <circle cx="75" cy="48" r="8" fill="#F97316" />
      <circle cx="90" cy="42" r="8" fill="#EA580C" />
    </g>

    <!-- Cute Isometric Shopping Cart / Trolley (Right Front Side) -->
    <g transform="translate(560, 680)">
      <!-- Shadow under cart -->
      <ellipse cx="60" cy="95" rx="45" ry="18" fill="#000000" fill-opacity="0.2" />
      <!-- Wheels -->
      <circle cx="35" cy="92" r="7" fill="#334155" stroke="#94A3B8" stroke-width="2" />
      <circle cx="85" cy="92" r="7" fill="#334155" stroke="#94A3B8" stroke-width="2" />
      <circle cx="55" cy="102" r="7" fill="#1E293B" stroke="#64748B" stroke-width="2" />
      <circle cx="105" cy="102" r="7" fill="#1E293B" stroke="#64748B" stroke-width="2" />
      <!-- Cart Metal Frame Chassis -->
      <path d="M 35 88 L 85 88 L 95 60 L 25 60 Z" fill="#0284C7" />
      <!-- Wire Basket -->
      <path d="M 20 60 L 95 60 L 115 25 L 35 25 Z" fill="#38BDF8" fill-opacity="0.4" stroke="#0284C7" stroke-width="2.5" />
      <!-- Handle Bar -->
      <path d="M 20 60 L 15 15 L 25 15" fill="none" stroke="#E11D48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Bag inside cart -->
      <path d="M 45 45 L 85 45 L 80 15 L 50 15 Z" fill="#F59E0B" rx="4" />
      <!-- Bag handles -->
      <path d="M 58 15 Q 65 0 72 15" fill="none" stroke="#B45309" stroke-width="2.5" />
    </g>

    <!-- Beautiful Potted Plant / Shrub Outside Shop -->
    <g transform="translate(740, 580)">
      <!-- Pot Shadow -->
      <ellipse cx="25" cy="55" rx="20" ry="8" fill="#000000" fill-opacity="0.25" />
      <!-- Terracotta Pot -->
      <path d="M 10 30 L 40 30 L 35 55 L 15 55 Z" fill="#C2410C" />
      <path d="M 7 26 L 43 26 L 43 31 L 7 31 Z" fill="#EA580C" rx="2" />
      <!-- Lush 3D Foliage -->
      <circle cx="25" cy="18" r="22" fill="#15803D" />
      <circle cx="16" cy="12" r="16" fill="#22C55E" />
      <circle cx="34" cy="12" r="16" fill="#16A34A" />
      <circle cx="25" cy="2" r="14" fill="#4ADE80" />
      <!-- Little decorative yellow flowers -->
      <circle cx="20" cy="10" r="3.5" fill="#FDE047" />
      <circle cx="32" cy="18" r="3.5" fill="#FDE047" />
    </g>

    <!-- Warm Outdoor Lantern Light on Wall -->
    <g transform="translate(405, 410)">
      <!-- Bracket -->
      <path d="M 15 25 L 0 25 L 0 10" fill="none" stroke="#334155" stroke-width="3" />
      <!-- Lantern Body -->
      <polygon points="10,25 20,25 23,45 7,45" fill="#FEF08A" stroke="#1E293B" stroke-width="2" filter="url(#softGlow)" />
      <!-- Cap -->
      <polygon points="5,25 25,25 15,18" fill="#0F172A" />
    </g>
  </g>
</svg>
