name = "my-shop-manager-api"
main = "worker/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# NOTE: Do NOT place secrets (like GEMINI_API_KEY) in this file.
# In Cloudflare Dashboard:
# Go to Worker -> Settings -> Variables and Secrets -> Add Secret -> GEMINI_API_KEY
# Or via CLI:
# npx wrangler secret put GEMINI_API_KEY
